upstream wheel_app {
    server 127.0.0.1:8991;
    keepalive 32;
}

server {
    server_name wheel.akarpov.ru;
    access_log /var/log/nginx/wheel.access.log;
    error_log /var/log/nginx/wheel.error.log;

    client_max_body_size 2M;

    # Live spectating uses server-sent events. Buffering or an ordinary read
    # timeout would break the stream, so this location opts out of both.
    location /api/plays/ {
        proxy_pass http://wheel_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://wheel_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
